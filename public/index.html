<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>League Predictions</title>
  <meta name="description" content="Drag and drop to build your predicted final standings for six major football leagues.">
  <link rel="icon" href="/icons/icon-32.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#1e40af">
  <meta property="og:type" content="website">
  <meta property="og:title" content="League Predictions">
  <meta property="og:description" content="Drag and drop to build your predicted final standings for six major football leagues.">
  <meta property="og:image" content="https://league-predictions.vercel.app/og-image.png">
  <meta property="og:url" content="https://league-predictions.vercel.app/">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="League Predictions">
  <meta name="twitter:description" content="Drag and drop to build your predicted final standings for six major football leagues.">
  <meta name="twitter:image" content="https://league-predictions.vercel.app/og-image.png">
  <script src="/vendor/supabase.js"></script>
  <script type="module">
    // Landing rule: Predictions if the current season of your last league
    // hasn't kicked off yet, otherwise its Leaderboard. Any failure falls
    // back to the predictions page.
    import { supabaseClient as sb } from '/js/supabaseClient.js';
    import { lastLeague } from '/js/shell.js';

    const league = lastLeague();
    let target = `/predictions?league=${league}`;
    try {
      const { data: season } = await sb.from('seasons').select('season_year').eq('is_current', true).maybeSingle();
      const { data: ls } = season && await sb.from('league_seasons')
        .select('status, reveal_unlocked, first_kickoff_at')
        .eq('league', league).eq('season_year', season.season_year).maybeSingle();
      const started = ls && (ls.reveal_unlocked || ls.status !== 'upcoming'
        || (ls.first_kickoff_at && Date.parse(ls.first_kickoff_at) <= Date.now()));
      if (started) target = `/leaderboard?league=${league}`;
    } catch (e) {
      console.error('landing', e);
    }
    location.replace(target);
  </script>
  <meta name="color-scheme" content="light dark">
  <style>
    body{margin:0;font-family:system-ui,Arial,sans-serif;display:grid;place-items:center;height:100svh}
    a{color:#2563eb}
  </style>
</head>
<body>
  <p>Loading… <a href="/predictions?league=premierleague">Premier League</a></p>
  <noscript>
    <p>JavaScript is disabled. Click the link above.</p>
  </noscript>
</body>
</html>
